<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title"><title id="title">Steady — A little, often.</title><rect width="1200" height="630" fill="#0d1c14"/><rect x="32" y="32" width="1136" height="566" rx="40" fill="#13251b" stroke="#263e2e"/><g transform="translate(76 72) scale(.625)" color="#dce6d1" fill="#dce6d1"><path d="M7 35h12l8-20 10 35 8-20h12" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/></g><text x="130" y="101" fill="#dce6d1" font-family="Inter" font-size="26" font-weight="400" text-anchor="start">Steady</text><text x="930.138671875" y="99" fill="#aebeac" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">A record of movement</text><text x="80" y="344.06" fill="#dce6d1" font-family="Inter" font-size="76" font-weight="600" text-anchor="start">A little, often.</text><text x="80" y="500" fill="#aebeac" font-family="Inter" font-size="26" font-weight="400" text-anchor="start">Personal movement records, without medical advice.</text></svg>
